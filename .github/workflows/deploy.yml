name: Deploy gratis di cloud

on:
  push:
    branches: [main, master, Maste]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  backend:
    name: Backend ke Hugging Face
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sinkronkan folder backend
        env:
          HF_SPACE: ${{ vars.HF_SPACE || 'iamfizzer/absensi-fr-api' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-space
          rsync -a --delete \
            --exclude=.git \
            --exclude=employees/ \
            --exclude=requirements.txt \
            backend/ hf-space/
          cd hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "Deploy ${GITHUB_SHA}"
          git push

  frontend:
    name: Flutter Web ke Firebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/absensi_fr
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter Web
        run: >-
          flutter build web --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://iamfizzer-absensi-fr-api.hf.space/api/v1/' }}
          --dart-define=ENFORCE_ATTENDANCE_RADIUS=true

      - name: Pastikan build tidak memakai API lokal
        shell: bash
        run: |
          if grep -R -E "127\.0\.0\.1:8000|10\.0\.2\.2:8000|localhost:8000" build/web; then
            echo "Build masih mengandung URL API lokal."
            exit 1
          fi
          grep -R -q "iamfizzer-absensi-fr-api.hf.space" build/web

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: absensi-geo-fr-test
          channelId: live
          entryPoint: frontend/absensi_fr
